{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Fashion Hub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --brand: #2c2c2c;         /* Charcoal dark for headers */
  --accent: #e8c1a0;        /* Rose-gold accent */
  --light: #ffffff;          /* Card background */
  --text-dark: #222222;
  --muted: #7d7d7d;
  --input-border: #dcdcdc;
}
body {
  background: #f0f0f0;       /* Soft neutral gray */
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 0;
}
.login-card {
  background: var(--light);
  border-radius: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.08);
  overflow: hidden;
  width: 95%;
  max-width: 450px;
  margin: 1rem;
}
.login-header {
  background: var(--brand);
  color: var(--accent);
  text-align: center;
  padding: 2rem;
}
.login-header h4 { 
  margin:0; 
  font-weight:700; 
  letter-spacing:1.2px; 
  font-size:1.6rem;
}
.login-header p {
  margin-top: 0.5rem;
  font-size: 0.95rem;
  color: #f2d8c0;
}
.login-body { padding: 2rem; }
.form-control {
  border-radius:10px; 
  border:1px solid var(--input-border); 
  padding:.75rem;
  transition:.3s;
}
.form-control:focus {
  border-color: var(--accent);
  box-shadow: 0 0 6px rgba(232,193,160,0.3);
}
.btn-brand {
  background: var(--accent);
  color: var(--brand);
  border:none;
  border-radius:12px;
  width:100%;
  padding:.75rem;
  font-weight:700;
  font-size:1rem;
  transition:.3s;
}
.btn-brand:hover { 
  background: var(--brand);
  color: var(--accent);
}
.text-muted a { color: var(--accent); text-decoration:none; font-weight:600; }
.tab-toggle {
  display: flex;
  justify-content: center;
  margin-bottom: 1rem;
  gap: 1rem;
}
.tab-toggle button {
  background: none;
  border: none;
  font-weight:600;
  color: var(--muted);
  transition: .3s;
  font-size:0.95rem;
}
.tab-toggle button.active {
  color: var(--accent);
  border-bottom: 2px solid var(--accent);
  padding-bottom: 2px;
}
/* Messages */
.alert {
  border-radius: 10px;
  padding: 0.75rem 1rem;
  font-size: 0.95rem;
  margin-bottom: 1rem;
}
.alert-success { background: #e6f4ea; color: #1a7f37; }
.alert-error { background: #fde2e1; color: #c92a2a; }

/* Responsive tweaks */
@media (max-width: 576px) {
  .login-header h4 { font-size: 1.4rem; }
  .login-header p { font-size: 0.9rem; }
  .tab-toggle { flex-direction: column; gap: 0.5rem; }
}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <h4>Welcome Back 👋</h4>
    <p class="mb-0">Sign in to continue to Fashion Hub</p>
  </div>
  <div class="login-body">

    <!-- Display Django messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <!-- Email / Phone toggle -->
    <div class="tab-toggle">
      <button type="button" class="active" id="email-tab">Email</button>
      <button type="button" id="phone-tab">Phone</button>
    </div>

    <form method="POST" action="">
      {% csrf_token %}
        <div id="email-login">
        <div class="mb-3">
            <input type="email" name="email" class="form-control" placeholder="Email ID *">
        </div>
        </div>
        <div id="phone-login" style="display:none;">
        <div class="mb-3">
            <input type="text" name="phone" class="form-control" placeholder="Phone Number *">
        </div>
        </div>

      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password *">
      </div>
      <div class="d-flex justify-content-between mb-3">
        <div></div>
        <a href="" class="text-muted" style="font-size:.9rem;">Forgot Password?</a>
      </div>
      <button class="btn-brand mb-3">Login</button>
    </form>

    <div class="text-center mb-3 text-muted">OR</div>

    <p class="text-center text-muted">
      Don’t have an account? <a href="{% url 'register' %}">Register</a>
    </p>
  </div>
</div>

<script>
const emailTab = document.getElementById('email-tab');
const phoneTab = document.getElementById('phone-tab');
const emailLogin = document.getElementById('email-login');
const phoneLogin = document.getElementById('phone-login');

emailTab.addEventListener('click', ()=> {
  emailTab.classList.add('active');
  phoneTab.classList.remove('active');
  emailLogin.style.display='block';
  phoneLogin.style.display='none';
});
phoneTab.addEventListener('click', ()=> {
  phoneTab.classList.add('active');
  emailTab.classList.remove('active');
  emailLogin.style.display='none';
  phoneLogin.style.display='block';
});
</script>

</body>
</html>
