{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Fashion Hub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --brand: #2c2c2c;         /* Charcoal dark for headers */
  --accent: #e8c1a0;        /* Rose-gold accent */
  --light: #ffffff;          /* Card background */
  --text-dark: #222222;
  --muted: #7d7d7d;
  --input-border: #dcdcdc;
}
body {
  background: #f0f0f0;       /* Soft neutral gray */
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
}
.register-card {
  background: var(--light);
  border-radius: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.08);
  overflow: hidden;
  width: 95%;
  max-width: 480px;
}
.register-header {
  background: var(--brand);
  color: var(--accent);
  text-align: center;
  padding: 2rem;
}
.register-header h4 { 
  margin:0; 
  font-weight:700; 
  letter-spacing:1px; 
  font-size:1.6rem;
}
.register-header p {
  margin-top: 0.5rem;
  font-size: 0.95rem;
  color: #f2d8c0;
}
.register-body { padding: 2rem; }
.form-control {
  border-radius:10px; 
  border:1px solid var(--input-border); 
  padding:.75rem;
  transition:.3s;
}
.form-control:focus {
  border-color: var(--accent);
  box-shadow: 0 0 6px rgba(232,193,160,0.3);
}
.btn-brand {
  background: var(--accent);
  color: var(--brand);
  border:none;
  border-radius:12px;
  width:100%;
  padding:.75rem;
  font-weight:700;
  font-size:1rem;
  transition:.3s;
}
.btn-brand:hover { 
  background: var(--brand);
  color: var(--accent);
}
.google-btn {
  background:#fff; border:1px solid var(--input-border); border-radius:10px; width:100%;
  padding:.75rem; color:#333; font-weight:600; display:flex; align-items:center; justify-content:center; gap:.5rem; transition:.3s;
}
.google-btn:hover { background:#f5f5f5; }
.text-muted a { color: var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>

<div class="register-card">
  <div class="register-header">
    <h4>Create Your Account ✨</h4>
    <p class="mb-0">Join and enjoy a premium shopping experience</p>
  </div>
  <div class="register-body">

    <form method="POST" action="">
      {% csrf_token %}
      <div class="row g-2 mb-3">
        <div class="col-md-4"><input type="text" name="first_name" class="form-control" placeholder="First Name *"></div>
        <div class="col-md-4"><input type="text" name="middle_name" class="form-control" placeholder="Middle Name"></div>
        <div class="col-md-4"><input type="text" name="last_name" class="form-control" placeholder="Last Name"></div>
      </div>
      <div class="mb-3">
        <input type="text" name="phone" class="form-control" placeholder="Phone Number *">
      </div>
      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="Email ID *">
      </div>
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password *">
      </div>
      <div class="mb-3">
        <input type="password" name="password2" class="form-control" placeholder="Confirm Password *">
      </div>
      <button class="btn-brand mb-3">Register</button>
    </form>

    <div class="text-center mb-3 text-muted">OR</div>

    {% comment %} <a href="{% url 'socialaccount_login' 'google' %}" class="google-btn mb-3"> {% endcomment %}
      {% comment %} <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Continue with Google {% endcomment %}
    </a>

    <p class="text-center text-muted">
      Already have an account? <a href="{% url 'login' %}">Login</a>
    </p>
  </div>
</div>

</body>
</html>
